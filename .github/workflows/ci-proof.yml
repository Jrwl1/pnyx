# WHAT IT DO? Runs the core release proof chain on pushes and pull requests.

name: CI proof

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]

jobs:
  prove:
    runs-on: ubuntu-latest
    env:
      DB_PATH: ${{ runner.temp }}/pnyx-ci-proof.db
      AUTH_EMAIL_PROVIDER: inline
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Seed post-launch rehearsal data
        run: pnpm seed:launch-rehearsal

      - name: Verify post-launch rehearsal coverage
        run: pnpm launch:coverage

      - name: Run post-launch proof chain
        run: pnpm proof:postlaunch
